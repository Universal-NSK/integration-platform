[project]
name = "integration-platform"
version = "0.1.0"
requires-python = ">=3.8,<3.9"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/*",
    "services/*",
    "packages/*",
]

[dependency-groups]
dev = [
    "debugpy==1.8.1",
    "pyright>=1.1.411",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.4",
]



[tool.pyright]
pythonVersion = "3.8"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
    "services",
    "apps",
    "packages",
]

extraPaths = [
    "services/bitrix_gateway/src",
    "packages/runtime_files/src",
    "packages/platform_logging/src",
]

exclude = [
    "**/.venv",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/build",
    "**/dist",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]


[tool.pytest.ini_options]
testpaths = [
    "services",
    "apps",
    "packages",
]

python_files = [
    "test_*.py",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-markers",
]

markers = [
    "browser: реальный smoke test Selenium, ChromeDriver и Chrome",
    "nashdom_live: интеграционный тест против живого сайта наш.дом.рф",
]
